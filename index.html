.xe svg{display:block;width:30px;height:46px}.xe.me svg{width:38px;height:58px}
.xe.run svg{width:24px;height:38px}

.hint{position:absolute;left:8px;right:8px;top:8px;background:#000b;border-radius:10px;padding:6px 10px;font-size:14px;text-align:center;z-index:4}

.bar{position:relative;height:30px;border-radius:15px;background:#37425a;overflow:hidden;margin-bottom:10px}
.zone{position:absolute;top:0;bottom:0;background:var(--ok);opacity:.85}
.cur{position:absolute;top:-2px;bottom:-2px;width:6px;background:#fff;border-radius:3px;box-shadow:0 0 8px #fff}
.prog{height:12px;border-radius:6px;background:#37425a;overflow:hidden;margin-bottom:10px}
.prog i{display:block;height:100%;width:0;background:var(--ac)}
button{width:100%;border:0;border-radius:14px;padding:16px;font:800 20px inherit;background:var(--ac);color:#222;touch-action:manipulation}

.lb h4{margin:0 0 6px;font-size:13px;opacity:.7}
.row{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid #fff1}
.row.me{color:var(--ac);font-weight:700}
.ov{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;z-index:10;background:#000d}
.ov.on{display:flex}
.ov.late{background:#8b0000e6;animation:fl .35s infinite alternate}

.big{font-size:84px;line-height:1}
.cap{margin-top:10px;font-size:13px;opacity:.78;text-align:center;font-style:italic}
.ov h1{font-size:30px;margin:10px 0 6px}
.ov p{font-size:18px;margin:6px 0 18px;max-width:340px}
.shake{animation:sk .12s infinite}

function drawGhosts(peers){

    seen[p.id]=1;var run=q.s>=5,g=GH[p.id];
    if(!g){var h=0;for(var i=0;i<p.id.length;i++)h+=p.id.charCodeAt(i);g={c:COLS[h%5],run:null,el:mk("ghost","",q.n)};GH[p.id]=g}
    if(g.run!==run){g.run=run;g.el.innerHTML=(run?runner():bike(g.c))+"<small>"+q.n+"</small>";g.el.classList.toggle("run",run)}
    place(g.el,[q.x,q.y]);
  });

}
function render(peers){drawGhosts(peers);
  var L=peers.filter(function(p){return p.presence&&p.presence.n}).map(function(p){var q=p.presence;return {me:p.isMe&&p.sameTab!==false,n:q.n,s:q.s,g:q.g||0,r:q.r,l:q.l||0,m:q.m||0}});
  L.sort(function(a,b){var ra=a.r=="ok"?0:a.r=="late"?2:1,rb=b.r=="ok"?0:b.r=="late"?2:1;if(ra!=rb)return ra-rb;if(ra==0)return b.l-a.l;return b.g-a.g});
  var T=titles(L);$("cnt").textContent="("+L.length+" người)";var lc=$("lc");if(lc)lc.textContent="Đang có "+L.length+" người trong phòng";
  $("lb").innerHTML=L.length?L.map(function(x,i){var t=x.r=="ok"?"✅ "+x.l.toFixed(1)+"s dư":x.r=="late"?"💀 Trễ":(x.s==0?"⏳ ":x.s==1||x.s==3?"🏍️ ":x.s==2||x.s==6?"💳 ":x.s==4?"🅿️ ":"🏃 ")+x.g+"%";var nm=String(x.n).replace(/[<>&]/g,""),bd=T.filter(function(z){return z[3]===x}).map(function(z){return z[0]}).join("");return '<div class="row'+(x.me?" me":"")+'"><span>'+(i+1)+". "+nm+" "+bd+'</span><span>'+t+'</span></div>'}).join(""):'<div style="opacity:.6">Chỉ mình bạn đang chơi. Gửi link cho mọi người vào cùng nhé!</div>';
  var tb=$("ttbox");if(T.length){tb.style.display="block";$("tt").innerHTML=T.map(function(z){return '<div class="row"><span>'+z[0]+' '+z[1]+'</span><span>'+String(z[2]).replace(/[<>&]/g,"")+'</span></div>'}).join("")}else tb.style.display="none";
}
var ME="",NM={},G={},SOFF=0,lanesArr=[],kick=function(){},HOST=new URLSearchParams(location.search).get("host")||(function(){try{return localStorage.getItem("dk815host")}catch(e){return null}})();
var LANEX=[42.5,52.2,61.9];
function wantAct(){if(st.startReq){st.startReq=false;return "start"}if(st.resetReq){st.resetReq=false;return "reset"}if(st.rel){st.rel=false;return "release"}if(st.stage==2&&!st.done&&st.mode=="run")return "claim";return null}
function renderLanes(){
  for(var i=0;i<3;i++){var c=$("ln"+i);if(c)c.setAttribute("fill",lanesArr[i]?"#ff4d4d":"#2ecc71")}
  var el=$("lanes");if(!el)return;
  el.innerHTML='<div style="display:flex;gap:6px;margin-bottom:8px">'+[0,1,2].map(function(i){var o=lanesArr[i],me=o&&o==ME;return '<div style="flex:1;text-align:center;font-size:12px;padding:6px 2px;border-radius:8px;background:'+(me?"#ffb70333":o?"#ff4d4d33":"#2ecc7133")+'">Lane '+(i+1)+'<br><b>'+(me?"BẠN":o?String(NM[o]||"xe khác").slice(0,8):"trống")+'</b></div>'}).join("")+'</div>';
}
function showLobby(){
  $("hint").textContent="🕐 Phòng chờ: đợi chủ phòng bấm bắt đầu";
  $("clock").textContent="08:14:10";$("clock").className="clock";$("rank").textContent="";
  $("panel").innerHTML='<div style="text-align:center;margin-bottom:10px"><div style="font-size:42px">🚦</div><div id="lc" style="opacity:.8;font-size:14px">Đang chờ mọi người...</div></div>'+(HOST?'<button id="gs">BẮT ĐẦU CHO CẢ PHÒNG 🚦</button>':'<div style="text-align:center;font-size:14px">Chủ phòng sẽ bấm bắt đầu. Nhớ giữ màn hình sáng nhé!</div>')+'<div style="text-align:center;margin-top:14px;font-size:13px;opacity:.7"><a id="solo" style="text-decoration:underline;cursor:pointer">Chơi thử một mình</a> &nbsp;·&nbsp; <a href="/huong-dan.html" target="_blank" style="color:inherit">📖 Luật chơi</a>'+(HOST?' &nbsp;·&nbsp; <a id="rst" style="text-decoration:underline;cursor:pointer">🧹 Xóa danh sách cũ</a>':' &nbsp;·&nbsp; <a id="hostb" style="text-decoration:underline;cursor:pointer">🔑 Tôi là chủ phòng</a>')+'</div>';
  if(HOST)$("gs").onclick=function(){
    var r0=+(G.round||0);st.startReq=true;kick();$("gs").textContent="Đang bắt đầu...";
    setTimeout(function(){
      if(st.mode=="lobby"&&+(G.round||0)==r0&&$("gs")){
        HOST=null;try{localStorage.removeItem("dk815host")}catch(e){}
        alert("Chưa bắt đầu được. Mã chủ phòng có thể sai, bạn nhập lại nhé.");showLobby();
      }
    },5000);
  };
  var hb=$("hostb");if(hb)hb.onclick=function(){
    var c=prompt("Nhập mã chủ phòng:");if(!c)return;
    HOST=c.trim();try{localStorage.setItem("dk815host",HOST)}catch(e){}showLobby();
  };
  var rb=$("rst");if(rb)rb.onclick=function(){st.resetReq=true;kick();rb.textContent="Đã xóa ✓"};
  $("solo").onclick=function(){begin(performance.now()+3000)};
}
function toLobby(){
  stopRain();st.mode="lobby";st.stage=0;st.done=false;st.res=null;st.left=0;st.lane=-1;
  $("ov").className="ov";$("app").classList.remove("shake");
  [].slice.call(scene.querySelectorAll(".xe")).forEach(function(n){n.remove()});GH={};
  [0,1,2].forEach(function(i){$("arm"+i).style.transform="rotate(0)"});
  dirty=true;showLobby();
}
function onPoll(d){
  G=d.game||{};SOFF=(d.now||Date.now())-Date.now();lanesArr=d.lanes||[];
  var nm={};d.peers.forEach(function(p){if(p.p&&p.p.n)nm[p.id]=p.p.n});NM=nm;
  if(st.mode=="lobby"&&G.phase=="run"&&+G.round>st.round){
    var ms=+G.startAt-(Date.now()+SOFF);st.round=+G.round;
    if(ms>-1500)begin(performance.now()+ms);
  }
  if(st.mode=="run"&&st.stage==2&&typeof d.lane=="number"){
    if(st.lane<0&&d.lane>=0){st.lane=d.lane;st.lx=LANEX[d.lane];stageUI()}
    else if(st.lane>=0&&d.lane<0){st.lane=-1;stageUI()}
  }
  renderLanes();
}
function pollRoom(ok,fail){
  var id=Math.random().toString(36).slice(2,10),state={},h=null,fails=0,started=false,busy=false;ME=id;
  var api={presence:function(p){Object.keys(p).forEach(function(k){state[k]=p[k]});return Promise.resolve()},onPeers:function(f){h=f}};
  function loop(){
    if(busy)return;busy=true;
    fetch("/api/state",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id:id,p:state,a:wantAct(),key:HOST||""})})
    .then(function(r){if(!r.ok)throw 0;return r.json()})
    .then(function(d){fails=0;if(!started){started=true;ok(api)}onPoll(d);if(h)h({peers:d.peers.map(function(x){return {id:x.id,presence:x.p,isMe:x.id===id,sameTab:x.id===id}})})})
    .catch(function(){fails++;if(!started&&fails>=2){started=true;fail()}})
    .then(function(){busy=false});
  }
  kick=function(){if(busy)setTimeout(kick,150);else loop()};
  loop();setInterval(loop,2000);
}
function connect(){
  function solo(){$("lb").textContent="Chế độ chơi một mình"}
  function use(r){room=r;r.onPeers(function(c){render(c.peers)});dirty=true}
  pollRoom(use,solo);
}
window.addEventListener("pagehide",function(){try{navigator.sendBeacon("/api/state",new Blob([JSON.stringify({id:ME,a:"leave"})],{type:"application/json"}))}catch(e){}});
setInterval(sync,300);
showName();connect();requestAnimationFrame(tick);
})();
</script>
