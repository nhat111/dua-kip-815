<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Đua kịp 8:15</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;600;800&display=swap" rel="stylesheet"><style>
:root{--bg:#dde2e6;--card:#fbfbf9;--ink:#17212b;--mute:#5d6b78;--line:#c3cbd2;--ac:#f26b21;--acd:#c74d0c;--ok:#12935a;--bad:#d62839;--tx:#17212b;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12181f;--card:#1c252f;--ink:#eef2f5;--mute:#93a1ad;--line:#2f3b47;--tx:#eef2f5;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums}
.wrap{max-width:480px;margin:0 auto;padding:12px 12px 28px}
.top{display:flex;justify-content:space-between;align-items:stretch;gap:10px;margin-bottom:10px}
.top>div:first-child{background:#141a21;border-radius:14px;padding:6px 14px 8px;border-bottom:4px solid var(--ac);flex:1;display:flex;align-items:center}
.clock{font:800 38px/1 "Be Vietnam Pro",ui-monospace,monospace;letter-spacing:.02em;color:#ffd9bf}
.clock.hot{color:#ff5a5f;animation:bl .4s infinite}
@keyframes bl{50%{opacity:.45}}
a.hp{display:grid;place-items:center;text-decoration:none}
.hp{width:40px;height:40px;border-radius:12px;padding:0;font-size:18px;background:var(--card);border:2px solid var(--ink);color:var(--ink);flex:none;font-weight:700}
.sub{font-size:12px;color:var(--mute);text-align:right;line-height:1.35}
.sub b{color:var(--ink);font-size:15px}
.scene{position:relative;border-radius:18px;overflow:hidden;aspect-ratio:360/400;background:#9fb3c8;border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink)}
.scene svg{position:absolute;inset:0;width:100%;height:100%}
.xe{position:absolute;font-size:30px;transform:translate(-50%,-50%);transition:left .12s linear,top .12s linear;line-height:1}
.xe.ghost{opacity:.92;transition:left 1.8s linear,top 1.8s linear}
.lg1{animation:stp .32s infinite}.lg2{animation:stp .32s infinite .16s}@keyframes stp{50%{transform:translateY(-3px)}}
.xe.parked svg{width:22px;height:34px}.xe.parked{transition:none}
#rain,#fl{position:absolute;inset:0;pointer-events:none;display:none;z-index:5}
#rain{background-image:linear-gradient(100deg,transparent 46%,rgba(200,225,255,.5) 50%,transparent 54%);background-size:16px 40px;animation:rn .3s linear infinite}
@keyframes rn{to{background-position:-16px 40px}}
#fl{background:#fff;opacity:0;transition:opacity .3s}
.storm>svg{filter:brightness(.62) saturate(.8)}
.horn{position:absolute;right:10px;bottom:10px;width:56px;height:56px;border-radius:50%;padding:0;font-size:24px;z-index:5;display:none;background:var(--ac);border:3px solid #17212b;box-shadow:3px 3px 0 #17212b}
.bip{position:absolute;transform:translate(-50%,-190%);font:900 14px "Be Vietnam Pro",system-ui;color:#fff;background:var(--bad);padding:2px 8px;border-radius:10px;z-index:6;animation:pop .7s forwards;white-space:nowrap}
@keyframes pop{from{transform:translate(-50%,-150%) scale(.6)}to{transform:translate(-50%,-240%) scale(1.1);opacity:0}}
.xe.me{font-size:38px;z-index:3;filter:drop-shadow(0 0 0 #fff) drop-shadow(0 0 5px #f26b21)}
.xe svg{display:block;width:30px;height:46px}.xe.me svg{width:38px;height:58px}
.xe.run svg{width:24px;height:38px}
.xe small{position:absolute;left:50%;top:-10px;transform:translateX(-50%);font-size:10px;font-weight:600;background:#17212bd9;padding:1px 5px;border-radius:6px;white-space:nowrap;color:#fff}
.xe.me small{background:var(--ac);color:#17212b;font-weight:800}
.hint{position:absolute;left:8px;right:8px;top:8px;background:#fbfbf9ee;color:#17212b;border:2px solid #17212b;border-radius:10px;padding:6px 10px;font-size:14px;font-weight:600;text-align:center;z-index:4}
.panel{margin-top:14px;background:var(--card);border:2px solid var(--ink);border-radius:16px;padding:14px}
.bar{position:relative;height:34px;border-radius:8px;background:repeating-linear-gradient(90deg,var(--line) 0 2px,transparent 2px 12px),#e6eaee;border:2px solid var(--ink);overflow:hidden;margin-bottom:12px}
.zone{position:absolute;top:0;bottom:0;background:var(--ok);opacity:.9}
.cur{position:absolute;top:-2px;bottom:-2px;width:6px;background:#17212b;border-radius:2px;box-shadow:0 0 0 2px #fff}
.prog{height:14px;border-radius:7px;background:#e6eaee;border:2px solid var(--ink);overflow:hidden;margin-bottom:12px}
.prog i{display:block;height:100%;width:0;background:var(--ac)}
button{width:100%;border:2px solid #17212b;border-radius:14px;padding:15px;font:800 19px "Be Vietnam Pro",system-ui,sans-serif;background:var(--ac);color:#17212b;box-shadow:0 4px 0 #17212b;touch-action:manipulation;transition:transform .08s,box-shadow .08s}
button:active{transform:translateY(4px);box-shadow:0 0 0 #17212b}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #1d6fe0;outline-offset:2px}
input{width:100%;padding:13px;border-radius:12px;border:2px solid var(--ink);background:#fff;color:#17212b;font:600 17px "Be Vietnam Pro",system-ui,sans-serif;margin-bottom:12px;user-select:text}
.slots{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:10px}.slots button{padding:14px 0;font-size:18px;border-radius:10px;background:#fff;color:#17212b;box-shadow:0 3px 0 #17212b}
.lb{margin-top:14px;background:var(--card);border:2px solid var(--ink);border-radius:16px;padding:12px 14px;font-size:14px}
.lb h4{margin:0 0 8px;font-size:14px;font-weight:800;color:var(--ink)}
.row{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line)}
.row:last-child{border-bottom:0}
.row.me{color:var(--acd);font-weight:800}
.ov{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;z-index:10;background:#10161cf2;color:#fff}
.ov.on{display:flex}
.ov.late{background:#8e1220f2;animation:fl .35s infinite alternate}
@keyframes fl{to{background:#1a0509f2}}
.big{font-size:84px;line-height:1}
.cap{margin-top:12px;font-size:13px;color:var(--mute);text-align:center;font-style:italic;line-height:1.5}
.ov .cap{color:#ffffffbb}
.ov h1{font-size:30px;margin:10px 0 6px;font-weight:800}
.ov p{font-size:18px;margin:6px 0 18px;max-width:340px}
.shake{animation:sk .12s infinite}
@keyframes sk{25%{transform:translate(-5px,3px)}75%{transform:translate(5px,-3px)}}
@media (prefers-reduced-motion:reduce){.clock.hot,.ov.late{animation:none}}
</style></head>

    place(g.el,[q.x,q.y]);
  });
  Object.keys(GH).forEach(function(k){if(!seen[k]){GH[k].el.remove();delete GH[k]}});
}
function render(peers){drawGhosts(peers);
  var L=peers.filter(function(p){return p.presence&&p.presence.n&&!isStale(p.presence)}).map(function(p){var q=p.presence;return {me:p.isMe&&p.sameTab!==false,n:q.n,s:q.s,g:q.g||0,r:q.r,l:q.l||0,m:q.m||0}});
  L.sort(function(a,b){var ra=a.r=="ok"?0:a.r=="late"?2:1,rb=b.r=="ok"?0:b.r=="late"?2:1;if(ra!=rb)return ra-rb;if(ra==0)return b.l-a.l;return b.g-a.g});
  var T=titles(L);$("cnt").textContent="("+L.length+" người)";var lc=$("lc");if(lc)lc.textContent="Đang có "+L.length+" người trong phòng";
  $("lb").innerHTML=L.length?L.map(function(x,i){var t=x.r=="ok"?"✅ "+x.l.toFixed(1)+"s dư":x.r=="late"?"💀 Trễ":(x.s==0?"⏳ ":x.s==1||x.s==3?"🏍️ ":x.s==2||x.s==6?"💳 ":x.s==4?"🅿️ ":"🏃 ")+x.g+"%";var nm=String(x.n).replace(/[<>&]/g,""),bd=T.filter(function(z){return z[3]===x}).map(function(z){return z[0]}).join("");return '<div class="row'+(x.me?" me":"")+'"><span>'+(i+1)+". "+nm+" "+bd+'</span><span>'+t+'</span></div>'}).join(""):'<div style="opacity:.6">Chỉ mình bạn đang chơi. Gửi link cho mọi người vào cùng nhé!</div>';
  var tb=$("ttbox");if(T.length){tb.style.display="block";$("tt").innerHTML=T.map(function(z){return '<div class="row"><span>'+z[0]+' '+z[1]+'</span><span>'+String(z[2]).replace(/[<>&]/g,"")+'</span></div>'}).join("")}else tb.style.display="none";
}
var SOLO=0,ME="",NM={},G={},SOFF=0,lanesArr=[],kick=function(){},HOST=new URLSearchParams(location.search).get("host")||(function(){try{return localStorage.getItem("dk815host")}catch(e){return null}})();
var LANEX=[62.8,72.5,82.2,25.6,35.3],SLOT=[2,3,4,0,1],KOF=[3,4,0,1,2];
function laneNo(k){return SLOT[k]+1}
function wantAct(){if(st.startReq){st.startReq=false;return "start"}if(st.resetReq){st.resetReq=false;return "reset"}if(st.rel){st.rel=false;return "release"}if(st.stage==2&&!st.done&&st.mode=="run")return "claim";return null}
function renderLanes(){
  for(var i=0;i<5;i++){var c=$("ln"+i);if(c)c.setAttribute("fill",lanesArr[i]?"#ff4d4d":"#2ecc71");var z=$("lz"+i);if(z)z.setAttribute("fill-opacity",lanesArr[i]&&lanesArr[i]==ME?".35":"0")}
  var el=$("lanes");if(!el)return;
  el.innerHTML='<div style="display:flex;gap:4px;margin-bottom:8px">'+KOF.map(function(i){var o=lanesArr[i],me=o&&o==ME;return '<div style="flex:1;text-align:center;font-size:11px;padding:6px 1px;border-radius:8px;background:'+(me?"#f26b2133":o?"#ff4d4d33":"#2ecc7133")+'">Lane '+laneNo(i)+'<br><b>'+(me?"BẠN":o?String(NM[o]||"xe khác").slice(0,8):"trống")+'</b></div>'}).join("")+'</div>';
}
function showLobby(){$("help").style.visibility="visible";
  $("hint").textContent="🕐 Phòng chờ: đợi chủ phòng bấm bắt đầu";
  $("clock").textContent="08:14:10";$("clock").className="clock";$("rank").textContent="";
  $("panel").innerHTML='<div style="text-align:center;margin-bottom:10px"><div style="font-size:42px">🚦</div><div id="lc" style="opacity:.8;font-size:14px">Đang chờ mọi người...</div></div>'+(HOST?'<button id="gs">BẮT ĐẦU CHO CẢ PHÒNG 🚦</button>':'<div style="text-align:center;font-size:14px">Chủ phòng sẽ bấm bắt đầu. Nhớ giữ màn hình sáng nhé!</div>')+'<div style="text-align:center;margin-top:14px;font-size:13px;opacity:.7"><a id="solo" style="text-decoration:underline;cursor:pointer">Chơi thử một mình</a>'+(HOST?' &nbsp;·&nbsp; <a id="rst" style="text-decoration:underline;cursor:pointer">🧹 Xóa danh sách</a>':' &nbsp;·&nbsp; <a id="hostb" style="text-decoration:underline;cursor:pointer">🔑 Tôi là chủ phòng</a>')+'</div>';
  if(HOST)$("gs").onclick=function(){
    var r0=+(G.round||0);st.startReq=true;kick();$("gs").textContent="Đang bắt đầu...";
    setTimeout(function(){
      if(st.mode=="lobby"&&+(G.round||0)==r0&&$("gs")){
        HOST=null;try{localStorage.removeItem("dk815host")}catch(e){}
        alert("Chưa bắt đầu được. Mã chủ phòng có thể sai, bạn nhập lại nhé.");showLobby();
      }
    },5000);
  };
  var hb=$("hostb");if(hb)hb.onclick=function(){
    var c=prompt("Nhập mã chủ phòng:");if(!c)return;
    HOST=c.trim();try{localStorage.setItem("dk815host",HOST)}catch(e){}showLobby();
  };
  var rb=$("rst");if(rb)rb.onclick=function(){st.resetReq=true;kick();rb.textContent="Đã xóa ✓"};
  $("solo").onclick=function(){begin(performance.now()+3000)};
}
function toLobby(){
  stopRain();st.mode="lobby";st.stage=0;st.done=false;st.res=null;st.left=0;st.lane=-1;
  $("ov").className="ov";$("app").classList.remove("shake");
  [].slice.call(scene.querySelectorAll(".xe")).forEach(function(n){n.remove()});GH={};
  [0,1,2,3,4].forEach(function(i){$("arm"+i).style.transform="rotate(0)"});
  dirty=true;showLobby();
}
function onPoll(d){
  G=d.game||{};SOFF=(d.now||Date.now())-Date.now();lanesArr=d.lanes||[];
  var nm={};d.peers.forEach(function(p){if(p.p&&p.p.n)nm[p.id]=p.p.n});NM=nm;
  if(st.mode=="lobby"&&G.phase=="run"&&+G.round>st.round){
    var ms=+G.startAt-(Date.now()+SOFF);st.round=+G.round;
    if(ms>-1500)begin(performance.now()+ms);
  }
  if(st.mode=="run"&&st.stage==2&&typeof d.lane=="number"){
    if(st.lane<0&&d.lane>=0){st.lane=d.lane;st.lx=LANEX[d.lane];stageUI()}
    else if(st.lane>=0&&d.lane<0){st.lane=-1;stageUI()}
  }
  renderLanes();
}
function getId(){var k="dk815id",v=null;try{v=localStorage.getItem(k)}catch(e){}if(!v||!/^[a-z0-9]{6,16}$/.test(v)){v=Math.random().toString(36).slice(2,10)+Math.random().toString(36).slice(2,6);try{localStorage.setItem(k,v)}catch(e){}}return v}
function pollRoom(ok,fail){
  var id=getId(),state={},h=null,fails=0,started=false,busy=false;ME=id;
  var api={presence:function(p){Object.keys(p).forEach(function(k){state[k]=p[k]});return Promise.resolve()},onPeers:function(f){h=f}};
  function loop(){
    if(busy)return;busy=true;
    fetch("/api/state",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id:id,p:state,a:wantAct(),key:HOST||""})})
    .then(function(r){if(!r.ok)throw 0;return r.json()})
    .then(function(d){fails=0;if(!started){started=true;ok(api)}onPoll(d);if(h)h({peers:d.peers.map(function(x){return {id:x.id,presence:x.p,isMe:x.id===id,sameTab:x.id===id}})})})
    .catch(function(){fails++;if(!started&&fails>=2){started=true;fail()}})
    .then(function(){busy=false});
  }
  kick=function(){if(busy)setTimeout(kick,150);else loop()};
  loop();setInterval(loop,2000);
}
function soloLane(){if(!SOLO||st.stage!=2||st.lane>=0||st.done||soloLane.t)return;soloLane.t=setTimeout(function(){soloLane.t=0;if(!SOLO||st.stage!=2||st.lane>=0||st.done)return;var l=Math.floor(Math.random()*5);st.lane=l;st.lx=LANEX[l];lanesArr=[];lanesArr[l]=ME;stageUI()},1500+Math.random()*800)}
function connect(){
  function solo(){SOLO=1;$("lb").textContent="Chế độ chơi một mình";soloLane()}
  function use(r){room=r;r.onPeers(function(c){render(c.peers)});dirty=true}
  pollRoom(use,solo);
}
window.addEventListener("pagehide",function(){try{navigator.sendBeacon("/api/state",new Blob([JSON.stringify({id:ME,a:"leave"})],{type:"application/json"}))}catch(e){}});
setInterval(sync,300);
showName();connect();requestAnimationFrame(tick);
})();
</script>
