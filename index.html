<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Đua kịp 8:15</title>
<style>
:root{--bg:#10151f;--card:#1b2433;--tx:#f3f6fb;--ac:#ffb703;--ok:#2ecc71;--bad:#ff4d4d;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:480px;margin:0 auto;padding:10px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.clock{font:800 34px ui-monospace,Menlo,monospace;color:var(--ac)}
.clock.hot{color:var(--bad);animation:bl .4s infinite}
@keyframes bl{50%{opacity:.4}}
.sub{font-size:12px;opacity:.7;text-align:right}
.scene{position:relative;border-radius:14px;overflow:hidden;aspect-ratio:360/400;background:#9fb3c8}
.scene svg{position:absolute;inset:0;width:100%;height:100%}
.xe{position:absolute;font-size:30px;transform:translate(-50%,-50%);transition:left .12s linear,top .12s linear;line-height:1}
.xe.me{font-size:38px;z-index:3;filter:drop-shadow(0 0 6px #ffb703)}
.xe svg{display:block;width:30px;height:46px}.xe.me svg{width:38px;height:58px}
.xe small{position:absolute;left:50%;top:-10px;transform:translateX(-50%);font-size:10px;background:#000a;padding:1px 4px;border-radius:6px;white-space:nowrap;color:#fff}
.hint{position:absolute;left:8px;right:8px;top:8px;background:#000b;border-radius:10px;padding:6px 10px;font-size:14px;text-align:center;z-index:4}
.panel{margin-top:10px;background:var(--card);border-radius:14px;padding:12px}
.bar{position:relative;height:30px;border-radius:15px;background:#37425a;overflow:hidden;margin-bottom:10px}
.zone{position:absolute;top:0;bottom:0;background:var(--ok);opacity:.85}
.cur{position:absolute;top:-2px;bottom:-2px;width:6px;background:#fff;border-radius:3px;box-shadow:0 0 8px #fff}
.prog{height:12px;border-radius:6px;background:#37425a;overflow:hidden;margin-bottom:10px}
.prog i{display:block;height:100%;width:0;background:var(--ac)}
button{width:100%;border:0;border-radius:14px;padding:16px;font:800 20px inherit;background:var(--ac);color:#222;touch-action:manipulation}
button:active{transform:scale(.97)}
input{width:100%;padding:12px;border-radius:10px;border:1px solid #445;background:#0e1420;color:var(--tx);font-size:16px;margin-bottom:10px}
.lb{margin-top:10px;background:var(--card);border-radius:14px;padding:10px 12px;font-size:14px}
.lb h4{margin:0 0 6px;font-size:13px;opacity:.7}
.row{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid #fff1}
.row.me{color:var(--ac);font-weight:700}
.ov{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;z-index:10;background:#000d}
.ov.on{display:flex}
.ov.late{background:#8b0000e6;animation:fl .35s infinite alternate}
@keyframes fl{to{background:#000000ee}}
.big{font-size:84px;line-height:1}
.ov h1{font-size:34px;margin:10px 0 6px}
.ov p{font-size:18px;margin:6px 0 18px;max-width:340px}
.shake{animation:sk .12s infinite}
@keyframes sk{25%{transform:translate(-5px,3px)}75%{transform:translate(5px,-3px)}}
</style></head>
<body>
<div class="wrap" id="app">
  <div class="top"><div><div class="clock" id="clock">08:14:20</div></div><div class="sub">Hạn chót <b>08:15:00</b><br><span id="rank"></span></div></div>
  <div class="scene" id="scene">
    <svg viewBox="0 0 360 400" preserveAspectRatio="xMidYMid slice">
      <defs><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fa3b8"/><stop offset="1" stop-color="#d9dfe3"/></linearGradient></defs>
      <rect width="360" height="400" fill="url(#sk)"/>
      <rect x="0" y="0" width="360" height="130" fill="#5a4a4c"/>
      <g fill="#ecd6d0"><rect y="14" width="360" height="16"/><rect y="46" width="360" height="16"/><rect y="78" width="360" height="16"/></g>
      <g fill="#46586b"><rect x="20" y="16" width="22" height="12"/><rect x="90" y="16" width="22" height="12"/><rect x="170" y="16" width="22" height="12"/><rect x="250" y="16" width="22" height="12"/><rect x="315" y="16" width="22" height="12"/><rect x="50" y="48" width="22" height="12"/><rect x="130" y="48" width="22" height="12"/><rect x="215" y="48" width="22" height="12"/><rect x="290" y="48" width="22" height="12"/><rect x="20" y="80" width="22" height="12"/><rect x="100" y="80" width="22" height="12"/><rect x="190" y="80" width="22" height="12"/><rect x="270" y="80" width="22" height="12"/></g>
      <rect x="95" y="100" width="170" height="30" fill="#e8ecef"/>
      <rect x="110" y="108" width="140" height="22" fill="#1d2a33"/>
      <path d="M85 104 Q180 88 275 104" stroke="#fff" stroke-width="6" fill="none"/>
      <text x="180" y="124" font-size="9" fill="#9fd" text-anchor="middle" font-weight="700">CỬA LÊN KHOANG</text>
      <circle cx="30" cy="170" r="48" fill="#2f5d34"/><circle cx="340" cy="150" r="60" fill="#2a5230"/><circle cx="300" cy="200" r="40" fill="#336b3a"/>
      <rect y="205" width="360" height="45" fill="#3b4a3a"/>
      <rect x="0" y="215" width="75" height="30" fill="#ddd"/><g stroke="#999"><path d="M8 215v30M20 215v30M32 215v30M44 215v30M56 215v30M68 215v30"/></g>
      <rect x="235" y="205" width="125" height="46" fill="#5b4141"/>
      <rect x="75" y="180" width="165" height="8" fill="#2c3a46"/><rect x="80" y="188" width="4" height="62" fill="#555"/><rect x="232" y="188" width="4" height="62" fill="#555"/>
      <rect x="95" y="200" width="42" height="50" fill="#8bc4b8"/><rect x="100" y="206" width="14" height="20" fill="#cfeee8"/>
      <text x="116" y="196" font-size="8" fill="#fff" text-anchor="middle">NHÀ XE</text>
      <rect x="160" y="222" width="10" height="28" fill="#666"/><rect x="157" y="212" width="16" height="10" fill="#38b6ff"/>
      <g id="arm" style="transform-origin:165px 240px;transition:transform .5s"><rect x="165" y="236" width="75" height="6" fill="#fff"/><rect x="180" y="236" width="14" height="6" fill="#e33"/><rect x="208" y="236" width="14" height="6" fill="#e33"/></g>
      <rect y="250" width="360" height="150" fill="#2a2f36"/>
      <g stroke="#cfd4da" stroke-width="3" stroke-dasharray="14 12"><path d="M0 330H360"/></g>
    </svg>
    <div class="hint" id="hint">Nhập tên để vào đua</div>
  </div>
  <div class="panel" id="panel"></div>
  <div class="lb"><h4>BẢNG XẾP HẠNG TRỰC TIẾP <span id="cnt"></span></h4><div id="lb"></div></div>
</div>
<div class="ov" id="ov"><div class="big" id="ovE"></div><h1 id="ovT"></h1><p id="ovP"></p><div style="width:260px"><button id="again">Chơi lại</button></div></div>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
var DUR=40, START=20; // 08:14:20 -> 08:15:00
var BOTS=["Anh Sếp","Bạn Dev","Chị Kế Toán","Bác Bảo Vệ","Em Intern"];
var MEMES=["Trễ rồi bro! Sếp đang nhìn kìa!","Bruh... Kẹt xe hay kẹt giường?","Quẹt thẻ chậm hơn cả Wi-Fi công ty!","Đi làm kiểu này lương về ví người khác!","Thôi xong, HR đã ghi tên bạn!"];
var PEN=["Phạt hát 1 câu karaoke","Phạt đóng quỹ team 20k","Phạt chống đẩy 5 cái","Phạt mời cả team trà sữa (nói đùa 😅)","Phạt làm điệu nhảy 10 giây"];
var st={stage:0,p:0,bots:[],t0:0,name:"",done:false,res:null,left:0,zc:.5,zw:.25,sp:1.2,zt:0};
var ac=null, room=null, myPeer="", dirty=true;

/* ---------- audio ---------- */
function A(){if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}return ac}
function tone(f,d,type,v,t0,f2){var c=A();if(!c)return;var t=c.currentTime+(t0||0),o=c.createOscillator(),g=c.createGain();o.type=type||"square";o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v||.15,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d)}
var snd={
 rev:function(){tone(90+Math.random()*40,.08,"sawtooth",.1)},
 beep:function(){tone(1400,.12,"square",.12)},
 ok:function(){tone(880,.1,"triangle",.2);tone(1320,.18,"triangle",.2,.1)},
 err:function(){tone(200,.25,"sawtooth",.2,0,80)},
 win:function(){[523,659,784,1047].forEach(function(f,i){tone(f,.2,"triangle",.2,i*.12)})},
 bruh:function(){tone(180,.5,"sawtooth",.25,0,60);},
 siren:function(){for(var i=0;i<6;i++){tone(i%2?600:900,.3,"square",.12,i*.3)}},
 buzz:function(){tone(120,.9,"sawtooth",.3,0,50)}
};
function say(t){try{var u=new SpeechSynthesisUtterance(t);u.lang="vi-VN";u.rate=1.1;u.pitch=1.3;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}

/* ---------- scene ---------- */
var scene=$("scene");
function bike(c){return '<svg viewBox="0 0 40 62"><rect x="17" y="0" width="6" height="12" rx="3" fill="#222"/><rect x="5" y="9" width="30" height="4" rx="2" fill="#333"/><rect x="2" y="6" width="5" height="6" rx="2" fill="#9ab"/><rect x="33" y="6" width="5" height="6" rx="2" fill="#9ab"/><rect x="16" y="48" width="8" height="14" rx="4" fill="#1a1a1a"/><ellipse cx="20" cy="46" rx="10" ry="9" fill="'+c+'"/><rect x="16" y="52" width="8" height="3" rx="1" fill="#ff3b3b"/><ellipse cx="20" cy="34" rx="10" ry="12" fill="#3b4a66"/><path d="M11 28 L6 12 M29 28 L34 12" stroke="#3b4a66" stroke-width="4" stroke-linecap="round"/><circle cx="20" cy="21" r="8" fill="'+c+'"/><rect x="12" y="20" width="16" height="3" fill="#fff" opacity=".7"/></svg>'}
var COLS=["#e63946","#2a9d8f","#8e6bd8","#f4a261","#4cc9f0"];
function mk(cls,txt,name){var d=document.createElement("div");d.className="xe "+cls;d.innerHTML=txt+(name?"<small>"+name+"</small>":"");scene.appendChild(d);return d}
var meEl=null, botEls=[];
function pos(stage,p,off){
  var x,y;
  if(stage<=1){x=18+34*p;y=90-30*p}
  else if(stage==2){x=52;y=60-8*p}
  else {x=52;y=44-14*p}
  return [x+(off||0),y];
}
function place(el,xy){el.style.left=xy[0]+"%";el.style.top=xy[1]+"%"}
function setup(){
  [].slice.call(scene.querySelectorAll(".xe")).forEach(function(n){n.remove()});
  $("arm").style.transform="rotate(0)";
  botEls=[];st.bots=[];
  for(var i=0;i<3;i++){st.bots.push({p:0,sp:.05+Math.random()*.035,off:(i-1)*9+(i==1?4:0),name:BOTS[Math.floor(Math.random()*BOTS.length)]});botEls.push(mk("",bike(COLS[i%5])))}
  meEl=mk("me",bike("#ffb703"),st.name);
  place(meEl,pos(1,0,0));
  st.bots.forEach(function(b,i){place(botEls[i],pos(1,0,b.off))});
}

/* ---------- panel / flow ---------- */
function showName(){
  var sv="";try{sv=localStorage.getItem("dk815name")||""}catch(e){}
  $("panel").innerHTML='<input id="nm" maxlength="14" placeholder="Tên của bạn" value="'+sv.replace(/"/g,"")+'"><button id="go">VÀO ĐUA 🏁</button>';
  $("hint").textContent="Nhập tên để vào đua";
  $("go").onclick=function(){var v=$("nm").value.trim()||"Ẩn danh";st.name=v.slice(0,14);try{localStorage.setItem("dk815name",st.name)}catch(e){}A();begin()};
}
function begin(){
  st.stage=1;st.p=0;st.done=false;st.res=null;st.left=0;st.t0=performance.now();
  $("ov").className="ov";$("app").classList.remove("shake");
  setup();stageUI();dirty=true;
}
function stageUI(){
  var s=st.stage,h=$("hint"),p=$("panel");
  if(s==1){h.textContent="🏍️ Chen vào cổng! Bấm GA liên tục!";p.innerHTML='<div class="prog"><i id="pg"></i></div><button id="act">GA GA GA! 💨</button>';$("act").addEventListener("pointerdown",function(e){e.preventDefault();tap1()})}
  else{
    h.textContent=s==2?"💳 Quẹt thẻ mở barrier: bấm khi vạch trắng nằm trong vùng xanh!":"🚪 Quẹt thẻ cửa lên khoang!";
    st.zw=s==2?.26:.17;st.sp=s==2?1.1:1.7;st.zc=.2+Math.random()*.6;st.zt=performance.now();
    p.innerHTML='<div class="bar" id="bar"><div class="zone" id="zn" style="left:'+((st.zc-st.zw/2)*100)+'%;width:'+(st.zw*100)+'%"></div><div class="cur" id="cur"></div></div><button id="act">QUẸT THẺ 💳</button>';
    $("act").addEventListener("pointerdown",function(e){e.preventDefault();tap2()});
  }
}
function curPos(){var t=((performance.now()-st.zt)/1000*st.sp)%2;return t<1?t:2-t}
function tap1(){
  if(st.stage!=1||st.done)return;
  snd.rev();st.p=Math.min(1,st.p+1/22);dirty=true;
  if(st.p>=1){snd.beep();st.stage=2;st.p=0;stageUI()}
}
function tap2(){
  if(st.done)return;
  var c=curPos();
  if(Math.abs(c-st.zc)<=st.zw/2){
    snd.ok();
    if(st.stage==2){$("arm").style.transform="rotate(-75deg)";st.stage=3;st.p=0;stageUI();place(meEl,pos(2,1))}
    else{win()}
  }else{snd.err();var b=$("bar");if(b){b.style.background="#7a2222";setTimeout(function(){b.style.background=""},200)}$("hint").textContent="❌ Thẻ lỗi! Quẹt lại nhanh!"}
  dirty=true;
}
function elapsed(){return (performance.now()-st.t0)/1000}
function win(){
  st.done=true;st.stage=4;st.left=Math.max(0,DUR-elapsed());st.res="ok";
  place(meEl,pos(3,1));snd.win();say("Đúng giờ! Quá đỉnh!");
  ov("🎉","ĐÚNG GIỜ!","Bạn vào khoang với "+st.left.toFixed(2)+" giây dư. Sếp mỉm cười 😎","");
  dirty=true;
}
function late(){
  st.done=true;st.res="late";
  var m=MEMES[Math.floor(Math.random()*MEMES.length)],pn=PEN[Math.floor(Math.random()*PEN.length)];
  snd.buzz();snd.siren();setTimeout(snd.bruh,1800);setTimeout(function(){say(m)},900);
  $("app").classList.add("shake");setTimeout(function(){$("app").classList.remove("shake")},1500);
  ov("🚨😭","TRỄ RỒI BRO!",m+"\n"+pn,"late");dirty=true;
}
function ov(e,t,p,c){$("ovE").textContent=e;$("ovT").textContent=t;$("ovP").innerHTML=p.replace("\n","<br><b>")+"</b>";$("ov").className="ov on "+c}
$("again").onclick=function(){begin()};

/* ---------- loop ---------- */
function tick(){
  if(st.stage>0&&!st.done){
    var e=elapsed(),sec=START+e,rem=Math.max(0,DUR-e);
    var s=Math.floor(sec)%60,ms=Math.floor((sec%1)*10);
    $("clock").textContent="08:14:"+(s<10?"0":"")+s+"."+ms;
    $("clock").className="clock"+(rem<10?" hot":"");
    if(st.stage==1){
      var ahead=0;st.bots.forEach(function(b,i){b.p=Math.min(1,b.p+b.sp*.016*(1+Math.random()*.5));if(b.p>st.p)ahead++;place(botEls[i],pos(1,b.p,b.off))});
      place(meEl,pos(1,st.p,0));$("rank").textContent="Hạng "+(ahead+1)+"/4 ở cổng";
      var pg=$("pg");if(pg)pg.style.width=(st.p*100)+"%";
    }else{
      $("rank").textContent="Còn "+rem.toFixed(1)+"s";
      var cu=$("cur");if(cu)cu.style.left="calc("+(curPos()*100)+"% - 3px)";
      if(st.stage==2)place(meEl,pos(2,0));else place(meEl,pos(3,0));
    }
    if(e>=DUR)late();
  }
  requestAnimationFrame(tick);
}

/* ---------- multiplayer ---------- */
function sync(){
  if(!room||!dirty||!st.name)return;dirty=false;
  var prog=st.stage==1?st.p*33:st.stage==2?33+10:st.stage==3?66+10:100;
  try{room.presence({n:st.name,s:st.stage,g:Math.round(prog),r:st.res,l:Math.round(st.left*100)/100})}catch(e){}
}
function render(peers){
  var L=peers.filter(function(p){return p.presence&&p.presence.n}).map(function(p){var q=p.presence;return {me:p.isMe&&p.sameTab!==false,n:q.n,s:q.s,g:q.g||0,r:q.r,l:q.l||0}});
  L.sort(function(a,b){var ra=a.r=="ok"?0:a.r=="late"?2:1,rb=b.r=="ok"?0:b.r=="late"?2:1;if(ra!=rb)return ra-rb;if(ra==0)return b.l-a.l;return b.g-a.g});
  $("cnt").textContent="("+L.length+" người)";
  $("lb").innerHTML=L.length?L.map(function(x,i){var t=x.r=="ok"?"✅ "+x.l.toFixed(1)+"s dư":x.r=="late"?"💀 Trễ":(x.s==1?"🏍️ ":x.s==2?"💳 ":"🚪 ")+x.g+"%";var nm=String(x.n).replace(/[<>&]/g,"");return '<div class="row'+(x.me?" me":"")+'"><span>'+(i+1)+". "+nm+'</span><span>'+t+'</span></div>'}).join(""):'<div style="opacity:.6">Chỉ mình bạn đang chơi. Gửi link cho mọi người vào cùng nhé!</div>';
}
function pollRoom(ok,fail){
  var id=Math.random().toString(36).slice(2,10),state={},h=null,fails=0,started=false,busy=false;
  var api={presence:function(p){Object.keys(p).forEach(function(k){state[k]=p[k]});return Promise.resolve()},onPeers:function(f){h=f}};
  function loop(){
    if(busy)return;busy=true;
    fetch("/api/state",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id:id,p:state})})
    .then(function(r){if(!r.ok)throw 0;return r.json()})
    .then(function(d){fails=0;if(!started){started=true;ok(api)}if(h)h({peers:d.peers.map(function(x){return {presence:x.p,isMe:x.id===id,sameTab:x.id===id}})})})
    .catch(function(){fails++;if(!started&&fails>=2){started=true;fail()}})
    .then(function(){busy=false});
  }
  loop();setInterval(loop,2000);
}
function connect(){
  function solo(){$("lb").textContent="Chế độ chơi một mình"}
  function use(r){room=r;r.onPeers(function(c){render(c.peers)});dirty=true}
  pollRoom(use,solo);
}
setInterval(sync,300);
showName();connect();requestAnimationFrame(tick);
})();
</script>
</body></html>
